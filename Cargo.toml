[package]
name = "caliptra-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "caliptra-server"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
caliptra-mcu-emulator = { path = "../caliptra-mcu-sw/emulator/app" }
caliptra-emu-bus   = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "294bcacbd34aca6e23ce7b652885e3236f7e7afe" }
caliptra-emu-cpu   = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "294bcacbd34aca6e23ce7b652885e3236f7e7afe" }
caliptra-emu-types = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "294bcacbd34aca6e23ce7b652885e3236f7e7afe" }

# Match caliptra-mcu-sw's test profile for emulator performance parity.
[profile.test]
inherits = "release"
opt-level = 3
lto = "thin"

# Even in dev/debug builds, optimize the emulator and CPU simulation crates
# so caliptra-server is not 10-30x slower than `cargo xtask runtime`.
[profile.dev.package.caliptra-mcu-emulator]
opt-level = 3
[profile.dev.package.caliptra-emu-cpu]
opt-level = 3
[profile.dev.package.caliptra-emu-bus]
opt-level = 3
[profile.dev.package.caliptra-emu-periph]
opt-level = 3
[profile.dev.package.caliptra-mcu-emulator-periph]
opt-level = 3
[profile.dev.package.caliptra-mcu-emulator-caliptra]
opt-level = 3
