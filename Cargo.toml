[package]
name = "caliptra-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "caliptra-server"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# aspeed caliptra-mcu-sw names the emulator crate "caliptra-mcu-emulator".
# test-mcu-mbox-driver is a runtime flag here: launch with
# `--test-feature test-mcu-mbox-driver` so EXECUTE=1 raises the MCU mailbox IRQ.
caliptra-mcu-emulator = { path = "../caliptra-mcu-sw/emulator/app" }
caliptra-mcu-emulator-ast1040 = { path = "../caliptra-mcu-sw/platforms/ast1040/emulator" }
# Must match the caliptra-sw rev pinned by ../caliptra-mcu-sw/Cargo.toml.
caliptra-emu-bus   = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "b99535ded32492d6c23bbc56f95e787a1e275b59" }
caliptra-emu-periph = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "b99535ded32492d6c23bbc56f95e787a1e275b59" }
caliptra-emu-cpu   = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "b99535ded32492d6c23bbc56f95e787a1e275b59" }
caliptra-emu-types = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "b99535ded32492d6c23bbc56f95e787a1e275b59" }

# Match caliptra-mcu-sw's test profile for emulator performance parity.
[profile.test]
inherits = "release"
opt-level = 3
lto = "thin"

# Even in dev/debug builds, optimize the emulator and CPU simulation crates
# so caliptra-server is not 10-30x slower than `cargo xtask runtime`.
[profile.dev.package.caliptra-mcu-emulator]
opt-level = 3
[profile.dev.package.caliptra-emu-cpu]
opt-level = 3
[profile.dev.package.caliptra-emu-bus]
opt-level = 3
[profile.dev.package.caliptra-emu-periph]
opt-level = 3
[profile.dev.package.caliptra-mcu-emulator-periph]
opt-level = 3
[profile.dev.package.caliptra-mcu-emulator-caliptra]
opt-level = 3
